<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VCK Avatar Editor</title>
<style>
  :root{
    --bg:#15171c; --bg2:#1c1f26; --panel:#20232b; --panel2:#262a33;
    --border:#333846; --text:#e8eaf0; --text-dim:#9aa0ae; --accent:#5b8cff;
    --accent2:#7aa2ff; --danger:#e5636a; --good:#4cc38a;
    --shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  html.light{
    --bg:#f2f3f6; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef0f4;
    --border:#dbdee5; --text:#1c1e24; --text-dim:#5b616e; --accent:#3563e9; --accent2:#3563e9;
    --danger:#c8383f; --good:#1f9d63;
    --shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  button, input, select{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100%;}

  header{
    display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--bg2);border-bottom:1px solid var(--border);flex:0 0 auto;
    z-index:20;
  }
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  header .spacer{flex:1;}
  .iconbtn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
  }
  .iconbtn:hover{border-color:var(--accent);}
  .pillbtn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;
    white-space:nowrap;
  }
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pillbtn.primary:hover{background:var(--accent2);}
  .pillbtn:disabled{opacity:.4;cursor:default;}

  #mainRow{flex:1;display:flex;min-height:0;position:relative;}

  #leftPanel, #rightPanel{
    background:var(--panel);border-right:1px solid var(--border);
    width:250px;flex:0 0 auto;overflow-y:auto;padding:12px;
  }
  #rightPanel{border-right:none;border-left:1px solid var(--border);width:340px;display:flex;flex-direction:column;}

  #viewportWrap{
    flex:1;position:relative;min-width:0;overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.72) 0 8%, transparent 24%),
      radial-gradient(circle at 78% 28%, rgba(255,255,255,.55) 0 10%, transparent 28%),
      radial-gradient(circle at 45% 80%, rgba(255,255,255,.30) 0 8%, transparent 30%),
      linear-gradient(180deg,#79cfff 0%,#a9e1ff 48%,#d8f2ff 100%);
  }
  #canvasHost{width:100%;height:100%;}
  #canvasHost canvas{display:block;touch-action:none;}

  .section{margin-bottom:16px;}
  .section h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    margin:0 0 8px 0;font-weight:700;
  }
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .toolbtn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:9px 6px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .toolbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .toolbtn:hover:not(.active){border-color:var(--accent);}

  .brushRow{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .brushRow input[type=range]{flex:1;accent-color:var(--accent);}
  .brushVal{width:22px;text-align:center;font-weight:700;font-size:13px;}

  label.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
    cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:6px;}
  label.toggle input{accent-color:var(--accent);width:16px;height:16px;}

  .swatchgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .swatch{
    width:100%;aspect-ratio:1/1;border-radius:7px;border:2px solid var(--border);cursor:pointer;
    position:relative;
  }
  .swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset, 0 0 8px var(--accent);}
  .swatchAddRow{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .swatchAddRow input[type=color]{width:38px;height:32px;border:1px solid var(--border);border-radius:7px;
    background:none;padding:0;cursor:pointer;}

  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .checkline input{accent-color:var(--accent);}

  #jsonHead{padding:12px 12px 6px;flex:0 0 auto;}
  #jsonArea{
    flex:1;width:100%;resize:none;background:var(--bg2);color:var(--text);
    border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;
    padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
    line-height:1.45;outline:none;
  }
  #jsonWrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px 12px;}
  #jsonToolbar{display:flex;gap:6px;padding:0 12px;flex:0 0 auto;margin-bottom:2px;}

  #statusBar{
    position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--border);
    padding:6px 10px;border-radius:8px;font-size:11.5px;color:var(--text-dim);box-shadow:var(--shadow);
    pointer-events:none;
  }
  #modeBadge{
    position:absolute;right:10px;top:10px;display:flex;gap:6px;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow);
  }
  #modeBadge button{
    border:none;background:transparent;color:var(--text-dim);padding:7px 12px;border-radius:8px;
    font-size:12.5px;font-weight:700;cursor:pointer;
  }
  #modeBadge button.active{background:var(--accent);color:#fff;}

  input[type=file]{display:none;}

  /* mobile */
  #panelToggle{display:none;}
  @media (max-width: 900px){
    header h1{font-size:13px;}
    #leftPanel, #rightPanel{
      position:absolute;top:0;bottom:0;z-index:15;box-shadow:var(--shadow);
      transform:translateX(-105%);transition:transform .2s ease;
    }
    #rightPanel{right:0;left:auto;transform:translateX(105%);width:88vw;max-width:380px;}
    #leftPanel{left:0;width:80vw;max-width:300px;}
    #leftPanel.open{transform:translateX(0);}
    #rightPanel.open{transform:translateX(0);}
    #panelToggle{display:flex;}
    #modeBadge{top:auto;bottom:10px;right:10px;}
    #statusBar{display:none;}
  }
  #scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:14;}
  #scrim.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="panelToggleLeft" title="Tools">☰</button>
    <h1>VCK Avatar Editor</h1>
    <div class="spacer"></div>
    <button class="pillbtn" id="btnImport">Import</button>
    <button class="pillbtn primary" id="btnExport">Export</button>
    <button class="iconbtn" id="btnTheme" title="Toggle theme">🌙</button>
    <button class="iconbtn" id="panelToggleRight" title="JSON">{ }</button>
    <input type="file" id="fileInput" accept="application/json,.json">
  </header>

  <div id="mainRow">
    <div id="scrim"></div>

    <!-- LEFT: tools -->
    <div id="leftPanel">
      <div class="section">
        <h2>Presets</h2>
        <div class="row">
          <button class="pillbtn" style="flex:1" id="presetDefault">Default</button>
        </div>
        <div class="row" style="margin-top:6px;">
          <button class="pillbtn" style="flex:1" id="presetBiggest">Biggest</button>
          <button class="pillbtn" style="flex:1" id="presetSmallest">Smallest</button>
        </div>
      </div>

      <div class="section">
        <h2>Tool</h2>
        <div class="toolgrid">
          <button class="toolbtn active" data-tool="paint">✏️ Paint</button>
          <button class="toolbtn" data-tool="fill">🪣 Fill</button>
        </div>
        <div class="brushRow">
          <span style="font-size:12px;color:var(--text-dim);">Brush</span>
          <input type="range" id="brushSize" min="1" max="5" step="1" value="1">
          <span class="brushVal" id="brushVal">1</span>
        </div>
      </div>

      <div class="section">
        <h2>Symmetry</h2>
        <label class="toggle"><span>Mirror while editing</span>
          <input type="checkbox" id="mirrorToggle">
        </label>
        <button class="pillbtn" id="mirrorHandBtn" style="width:100%;">Mirror last hand →</button>
      </div>

      <div class="section">
        <h2>Parts visible</h2>
        <label class="checkline"><input type="checkbox" class="partVis" data-part="head" checked> Head</label>
        <label class="checkline"><input type="checkbox" class="partVis" data-part="body" checked> Body</label>
        <label class="checkline"><input type="checkbox" class="partVis" data-part="rightHand" checked> Right Hand</label>
        <label class="checkline"><input type="checkbox" class="partVis" data-part="leftHand" checked> Left Hand</label>
      </div>

      <div class="section">
        <h2>Edit</h2>
        <div class="row">
          <button class="pillbtn" style="flex:1" id="undoBtn">↶ Undo</button>
        </div>
      </div>
    </div>

    <!-- CENTER: 3D viewport -->
    <div id="viewportWrap">
      <div id="canvasHost"></div>
      <div id="modeBadge">
        <button id="modeOrbit" class="active">🔄 Orbit</button>
        <button id="modeEdit">✏️ Edit</button>
      </div>
      <div id="statusBar">Orbit mode — drag to rotate, scroll to zoom. Switch to Edit to paint.</div>
    </div>

    <!-- RIGHT: palette + json -->
    <div id="rightPanel">
      <div class="section" style="padding:12px 12px 0;">
        <h2>Palette</h2>
        <div class="swatchgrid" id="paletteGrid"></div>
        <div class="swatchAddRow">
          <input type="color" id="customColor" value="#ff8800">
          <button class="pillbtn" id="addColorBtn" style="flex:1;">Add color</button>
        </div>
      </div>
      <div id="jsonToolbar">
        <h2 style="flex:1;align-self:center;">Avatar JSON</h2>
        <button class="pillbtn" id="applyJsonBtn">Apply</button>
      </div>
      <div id="jsonWrap">
        <textarea id="jsonArea" spellcheck="false"></textarea>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

/* =========================================================================
   VCK Avatar Editor
   Data format: each body part stores { data:[header, run,idx, run,idx...],
   width, height, depth }. header is always 2. RLE pairs are (runLength,
   paletteIndex). Voxel order within the flat run is x fastest, then y,
   then z slowest:  flatIndex = x + width*(y + height*z)
   ========================================================================= */

const PARTS = ['head','body','rightHand','leftHand'];

function decodeRLE(dataArr, volume){
  const out = new Uint8Array(volume);
  let p = 0;
  for (let i=1;i<dataArr.length;i+=2){
    const run = dataArr[i], idx = dataArr[i+1];
    out.fill(idx, p, p+run);
    p += run;
  }
  return out;
}
function encodeRLE(arr){
  const out = [2];
  let i=0;
  while(i<arr.length){
    let j=i;
    while(j<arr.length && arr[j]===arr[i]) j++;
    let runLen = j-i;
    while(runLen>0){
      const chunk = Math.min(runLen,255);
      out.push(chunk, arr[i]);
      runLen -= chunk;
    }
    i=j;
  }
  return out;
}
function vidx(x,y,z,w,h){ return x + w*(y + h*z); }

/* --------------------------- App state ---------------------------------- */
const state = {
  avatar: {},          // avatar[part] = {width,height,depth,colors:Uint8Array}
  palette: [],          // [[r,g,b,a], ...]
  createdAt: Date.now(),
  activeColor: 0,
  tool: 'paint',
  brushSize: 1,
  mirror: false,
  mode: 'orbit',
  lastEditedHand: null,
  partVisible: {head:true, body:true, rightHand:true, leftHand:true},
};
const undoStack = [];

/* --------------------------- Three.js setup ------------------------------*/
const host = document.getElementById('canvasHost');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
host.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);
const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
dir1.position.set(60,90,60);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
dir2.position.set(-60,20,-40);
scene.add(dir2);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.enablePan = false;
controls.minDistance = 20;
controls.maxDistance = 260;
controls.target.set(0, 22, 0);
camera.position.set(60, 55, 90);
controls.update();

const partGroups = {}; // part -> THREE.Group
const partMeshes = {}; // part -> InstancedMesh
const partCoords = {}; // part -> Int16Array flatIdx*3 = [x,y,z,...]
PARTS.forEach(p => { const g = new THREE.Group(); scene.add(g); partGroups[p]=g; });

const raycaster = new THREE.Raycaster();
const VOXEL_GAP = 0.06; // visual gap between cubes

function resizeRenderer(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/Math.max(h,1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);

function paletteColor(i){
  const c = state.palette[i] || [0.8,0.8,0.8,1];
  return new THREE.Color(c[0], c[1], c[2]);
}

function disposeMesh(mesh){
  if(!mesh) return;
  mesh.geometry.dispose();
  mesh.material.dispose();
  mesh.parent && mesh.parent.remove(mesh);
}

function buildPartMesh(part){
  const pd = state.avatar[part];
  const {width:w, height:h, depth:d, colors} = pd;
  const volume = w*h*d;
  disposeMesh(partMeshes[part]);

  const geo = new THREE.BoxGeometry(1-VOXEL_GAP, 1-VOXEL_GAP, 1-VOXEL_GAP);
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0.03});
  const mesh = new THREE.InstancedMesh(geo, mat, volume);
  mesh.userData.part = part;
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(volume*3), 3);

  const coords = new Int16Array(volume*3);
  const m = new THREE.Matrix4();
  let i=0;
  for(let z=0; z<d; z++){
    for(let y=0; y<h; y++){
      for(let x=0; x<w; x++){
        const idx = vidx(x,y,z,w,h);
        m.setPosition(x+0.5, y+0.5, z+0.5);
        mesh.setMatrixAt(idx, m);
        const col = paletteColor(colors[idx]);
        mesh.setColorAt(idx, col);
        coords[idx*3]=x; coords[idx*3+1]=y; coords[idx*3+2]=z;
        i++;
      }
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  mesh.visible = state.partVisible[part];

  partGroups[part].add(mesh);
  partMeshes[part] = mesh;
  partCoords[part] = coords;
}

function positionGroups(){
  const body = state.avatar.body, head = state.avatar.head;
  const rh = state.avatar.rightHand, lh = state.avatar.leftHand;
  if(!body||!head||!rh||!lh) return;
  partGroups.body.position.set(-body.width/2, 0, -body.depth/2);
  partGroups.head.position.set(-head.width/2, body.height - 1, -head.depth/2);
  partGroups.rightHand.position.set(body.width/2 - 2, body.height*0.32, -rh.depth/2);
  partGroups.leftHand.position.set(-body.width/2 - lh.width + 2, body.height*0.32, -lh.depth/2);
  controls.target.set(0, body.height*0.55, 0);
}

function rebuildAllMeshes(){
  PARTS.forEach(buildPartMesh);
  positionGroups();
}

function refreshVoxelColor(part, flatIdx){
  const mesh = partMeshes[part];
  const colorIdx = state.avatar[part].colors[flatIdx];
  mesh.setColorAt(flatIdx, paletteColor(colorIdx));
  mesh.instanceColor.needsUpdate = true;
}

function refreshAllColorsForPart(part){
  const pd = state.avatar[part];
  const mesh = partMeshes[part];
  for(let i=0;i<pd.colors.length;i++){
    mesh.setColorAt(i, paletteColor(pd.colors[i]));
  }
  mesh.instanceColor.needsUpdate = true;
}
function refreshAllColorsEverywhere(){ PARTS.forEach(refreshAllColorsForPart); }

/* ----------------------------- Loading ----------------------------------*/
function loadAvatarFromObject(obj){
  const avatar = {};
  PARTS.forEach(part=>{
    const p = obj[part];
    const volume = p.width*p.height*p.depth;
    avatar[part] = {
      width:p.width, height:p.height, depth:p.depth,
      colors: decodeRLE(p.data, volume)
    };
  });
  state.avatar = avatar;
  state.palette = (obj.palette || []).map(c=>c.slice());
  state.createdAt = obj.createdAt || Date.now();
  undoStack.length = 0;
  state.lastEditedHand = null;
  rebuildAllMeshes();
  renderPalette();
  updateJsonPanel();
  updateStatus();
}

function buildAvatarObject(){
  const obj = {};
  PARTS.forEach(part=>{
    const pd = state.avatar[part];
    obj[part] = {
      data: encodeRLE(pd.colors),
      depth: pd.depth, height: pd.height, width: pd.width
    };
  });
  obj.palette = state.palette.map(c=>c.slice());
  obj.createdAt = state.createdAt;
  obj.version = 3;
  return obj;
}

/* ------------------------------ JSON panel -------------------------------*/
function prettyStringify(value, indent){
  indent = indent||0;
  const pad = '  '.repeat(indent), pad2 = '  '.repeat(indent+1);
  if(Array.isArray(value)){
    const flat = value.every(v => typeof v !== 'object' || v===null);
    if(flat) return '[' + value.map(v=>JSON.stringify(v)).join(',') + ']';
    return '[\n' + value.map(v=>pad2+prettyStringify(v,indent+1)).join(',\n') + '\n'+pad+']';
  } else if(value && typeof value==='object'){
    const keys = Object.keys(value);
    return '{\n' + keys.map(k=>pad2+JSON.stringify(k)+': '+prettyStringify(value[k],indent+1)).join(',\n') + '\n'+pad+'}';
  }
  return JSON.stringify(value);
}
const jsonArea = document.getElementById('jsonArea');
let suppressJsonUpdate = false;
function updateJsonPanel(){
  if(suppressJsonUpdate) return;
  jsonArea.value = prettyStringify(buildAvatarObject());
}
document.getElementById('applyJsonBtn').addEventListener('click', ()=>{
  try{
    const obj = JSON.parse(jsonArea.value);
    PARTS.forEach(p=>{ if(!obj[p]) throw new Error('Missing part: '+p); });
    if(!obj.palette) throw new Error('Missing palette');
    loadAvatarFromObject(obj);
    flashStatus('JSON applied ✓');
  }catch(e){
    flashStatus('JSON error: '+e.message, true);
  }
});

/* ------------------------------- Palette ---------------------------------*/
const paletteGrid = document.getElementById('paletteGrid');
function renderPalette(){
  paletteGrid.innerHTML = '';
  state.palette.forEach((c,i)=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i===state.activeColor ? ' active':'');
    sw.style.background = `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${c[3]})`;
    sw.title = 'Color index '+i;
    sw.addEventListener('click', ()=>{ state.activeColor = i; renderPalette(); });
    sw.addEventListener('dblclick', (e)=>{
      e.stopPropagation();
      const hex = '#' + c.slice(0,3).map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
      const inp = document.createElement('input');
      inp.type = 'color'; inp.value = hex;
      inp.addEventListener('input', ()=>{
        const r = parseInt(inp.value.substr(1,2),16)/255;
        const g = parseInt(inp.value.substr(3,2),16)/255;
        const b = parseInt(inp.value.substr(5,2),16)/255;
        state.palette[i] = [r,g,b,1.0];
        refreshAllColorsEverywhere();
        renderPalette();
        updateJsonPanel();
      });
      inp.click();
    });
    paletteGrid.appendChild(sw);
  });
}
document.getElementById('addColorBtn').addEventListener('click', ()=>{
  const hex = document.getElementById('customColor').value;
  const r = parseInt(hex.substr(1,2),16)/255;
  const g = parseInt(hex.substr(3,2),16)/255;
  const b = parseInt(hex.substr(5,2),16)/255;
  state.palette.push([r,g,b,1.0]);
  state.activeColor = state.palette.length-1;
  renderPalette();
  updateJsonPanel();
});

/* -------------------------------- Undo -----------------------------------*/
function pushUndo(parts){
  const snap = {};
  parts.forEach(p=>{ snap[p] = state.avatar[p].colors.slice(); });
  undoStack.push(snap);
  if(undoStack.length>40) undoStack.shift();
}
function doUndo(){
  const snap = undoStack.pop();
  if(!snap) { flashStatus('Nothing to undo'); return; }
  Object.keys(snap).forEach(p=>{
    state.avatar[p].colors = snap[p];
    refreshAllColorsForPart(p);
  });
  updateJsonPanel();
  flashStatus('Undo ✓');
}
document.getElementById('undoBtn').addEventListener('click', doUndo);
window.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); }
});

/* ---------------------------- Voxel editing -------------------------------*/
function setVoxel(part, x, y, z, colorIdx, _isMirrorPass){
  const pd = state.avatar[part];
  if(x<0||y<0||z<0||x>=pd.width||y>=pd.height||z>=pd.depth) return;
  const flat = vidx(x,y,z,pd.width,pd.height);
  if(pd.colors[flat]===colorIdx) { /* still fine, continue for mirror */ }
  pd.colors[flat] = colorIdx;
  refreshVoxelColor(part, flat);

  if(!_isMirrorPass){
    if(part==='rightHand'||part==='leftHand') state.lastEditedHand = part;
    if(state.mirror){
      if(part==='head'||part==='body'){
        const mx = pd.width-1-x;
        setVoxel(part, mx, y, z, colorIdx, true);
      } else if(part==='rightHand'||part==='leftHand'){
        const other = part==='rightHand' ? 'leftHand':'rightHand';
        const opd = state.avatar[other];
        const mx = opd.width-1-x;
        setVoxel(other, mx, y, z, colorIdx, true);
      }
    }
  }
}

function paintBrush(part, x0,y0,z0, normalAxis, colorIdx){
  const size = state.brushSize;
  const half = Math.floor((size-1)/2);
  const lo = -half, hi = size-1-half;
  const pd = state.avatar[part];
  for(let a=lo; a<=hi; a++){
    for(let b=lo; b<=hi; b++){
      let x=x0,y=y0,z=z0;
      if(normalAxis==='x'){ y=y0+a; z=z0+b; }
      else if(normalAxis==='y'){ x=x0+a; z=z0+b; }
      else { x=x0+a; y=y0+b; }
      setVoxel(part, x, y, z, colorIdx);
    }
  }
}

function floodFill(part, x0,y0,z0, colorIdx, _isMirrorPass){
  const pd = state.avatar[part];
  const w=pd.width, h=pd.height, d=pd.depth;
  const startFlat = vidx(x0,y0,z0,w,h);
  const target = pd.colors[startFlat];
  if(target === colorIdx) return;
  const stack = [[x0,y0,z0]];
  const visited = new Uint8Array(pd.colors.length);
  visited[startFlat]=1;
  const changed = [];
  while(stack.length){
    const [x,y,z] = stack.pop();
    const flat = vidx(x,y,z,w,h);
    if(pd.colors[flat] !== target) continue;
    pd.colors[flat] = colorIdx;
    changed.push(flat);
    const neighbors = [[x-1,y,z],[x+1,y,z],[x,y-1,z],[x,y+1,z],[x,y,z-1],[x,y,z+1]];
    for(const [nx,ny,nz] of neighbors){
      if(nx<0||ny<0||nz<0||nx>=w||ny>=h||nz>=d) continue;
      const nf = vidx(nx,ny,nz,w,h);
      if(visited[nf]) continue;
      if(pd.colors[nf]!==target) continue;
      visited[nf]=1;
      stack.push([nx,ny,nz]);
    }
  }
  changed.forEach(flat=>refreshVoxelColor(part, flat));

  if(!_isMirrorPass){
    if(part==='rightHand'||part==='leftHand') state.lastEditedHand = part;
    if(state.mirror){
      if(part==='head'||part==='body'){
        const mx = pd.width-1-x0;
        floodFill(part, mx, y0, z0, colorIdx, true);
      } else {
        const other = part==='rightHand' ? 'leftHand':'rightHand';
        const opd = state.avatar[other];
        const mx = opd.width-1-x0;
        floodFill(other, mx, y0, z0, colorIdx, true);
      }
    }
  }
}

function mirrorLastHand(){
  const src = state.lastEditedHand;
  if(!src){ flashStatus('Edit a hand first', true); return; }
  const dst = src==='rightHand' ? 'leftHand' : 'rightHand';
  const sp = state.avatar[src], dp = state.avatar[dst];
  pushUndo([dst]);
  const nc = new Uint8Array(dp.colors.length);
  for(let z=0; z<sp.depth; z++){
    for(let y=0; y<sp.height; y++){
      for(let x=0; x<sp.width; x++){
        const sIdx = vidx(x,y,z,sp.width,sp.height);
        const mx = dp.width-1-x;
        const dIdx = vidx(mx,y,z,dp.width,dp.height);
        nc[dIdx] = sp.colors[sIdx];
      }
    }
  }
  dp.colors = nc;
  refreshAllColorsForPart(dst);
  updateJsonPanel();
  flashStatus('Mirrored ' + src + ' → ' + dst);
}
document.getElementById('mirrorHandBtn').addEventListener('click', mirrorLastHand);

/* --------------------------- Pointer / raycast ---------------------------*/
let dragging = false, strokeStarted = false;
let activePointerId = null;

function ndcFromEvent(clientX, clientY){
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((clientX-rect.left)/rect.width)*2-1,
    -((clientY-rect.top)/rect.height)*2+1
  );
}

function pickVoxel(clientX, clientY){
  const ndc = ndcFromEvent(clientX, clientY);
  raycaster.setFromCamera(ndc, camera);

  const meshes = PARTS
    .filter(p => state.partVisible[p] && partMeshes[p])
    .map(p => partMeshes[p]);

  if(!meshes.length) return null;

  const hits = raycaster.intersectObjects(meshes, false);
  if(!hits.length) return null;

  // InstancedMesh supplies the exact voxel through instanceId.
  const hit = hits[0];
  if(hit.instanceId === undefined || hit.instanceId === null) return null;

  const part = hit.object.userData.part;
  const coords = partCoords[part];
  const flat = hit.instanceId;
  if(!coords || flat < 0 || flat*3+2 >= coords.length) return null;

  const x = coords[flat*3];
  const y = coords[flat*3+1];
  const z = coords[flat*3+2];

  // face.normal is local to the cube. Pick the dominant axis.
  const n = hit.face && hit.face.normal ? hit.face.normal : {x:0,y:0,z:1};
  let axis = 'z';
  if(Math.abs(n.x) >= Math.abs(n.y) && Math.abs(n.x) >= Math.abs(n.z)) axis='x';
  else if(Math.abs(n.y) >= Math.abs(n.z)) axis='y';

  return {part, x, y, z, axis};
}

function applyToolAt(clientX, clientY){
  const pick = pickVoxel(clientX, clientY);
  if(!pick) return false;

  if(!strokeStarted){
    strokeStarted = true;
    const parts = new Set([pick.part]);
    if(state.mirror){
      if(pick.part==='head'||pick.part==='body'){
        parts.add(pick.part);
      }else{
        parts.add(pick.part==='rightHand'?'leftHand':'rightHand');
      }
    }
    pushUndo([...parts]);
  }

  if(state.tool==='paint'){
    paintBrush(pick.part, pick.x, pick.y, pick.z, pick.axis, state.activeColor);
  }else if(state.tool==='fill'){
    floodFill(pick.part, pick.x, pick.y, pick.z, state.activeColor);
  }
  return true;
}

function pointerXY(e){
  return {x:e.clientX, y:e.clientY};
}

function onPointerDown(e){
  if(state.mode!=='edit') return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.isPrimary===false) return;

  const pos = pointerXY(e);
  const didHit = applyToolAt(pos.x,pos.y);
  if(!didHit) return;

  e.preventDefault();
  e.stopPropagation();
  dragging = true;
  strokeStarted = true;
  activePointerId = e.pointerId;

  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
}

function onPointerMove(e){
  if(state.mode!=='edit' || !dragging) return;
  if(activePointerId!==null && e.pointerId!==activePointerId) return;
  if(state.tool!=='paint') return;

  const pos = pointerXY(e);
  applyToolAt(pos.x,pos.y);
  e.preventDefault();
}

function onPointerUp(e){
  if(activePointerId!==null && e.pointerId!==activePointerId) return;
  if(!dragging) return;

  dragging = false;
  activePointerId = null;
  strokeStarted = false;
  try{ renderer.domElement.releasePointerCapture(e.pointerId); }catch(_){}
  updateJsonPanel();
}

const host2 = renderer.domElement;
host2.addEventListener('pointerdown', onPointerDown, {passive:false});
host2.addEventListener('pointermove', onPointerMove, {passive:false});
host2.addEventListener('pointerup', onPointerUp, {passive:false});
host2.addEventListener('pointercancel', onPointerUp, {passive:false});
host2.addEventListener('contextmenu', e=>e.preventDefault());
host2.style.cursor = 'grab';

/* ------------------------------ Mode / tools ------------------------------*/

const modeOrbitBtn = document.getElementById('modeOrbit');
const modeEditBtn = document.getElementById('modeEdit');
const statusBar = document.getElementById('statusBar');
function setMode(mode){
  state.mode = mode;

  // OrbitControls must be completely disabled during painting.
  // Otherwise it can claim the same pointer/touch gesture before the
  // voxel raycaster gets a chance to edit the avatar.
  controls.enabled = (mode==='orbit');
  controls.enableRotate = (mode==='orbit');
  controls.enablePan = false;
  controls.enableZoom = true;

  dragging = false;
  strokeStarted = false;
  activePointerId = null;

  modeOrbitBtn.classList.toggle('active', mode==='orbit');
  modeEditBtn.classList.toggle('active', mode==='edit');
  host2.style.cursor = mode==='orbit' ? 'grab' : 'crosshair';
  updateStatus();
}
modeOrbitBtn.addEventListener('click', ()=>setMode('orbit'));
modeEditBtn.addEventListener('click', ()=>setMode('edit'));
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space' && !e.repeat && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault();
    setMode(state.mode==='orbit'?'edit':'orbit');
  }
});

function updateStatus(){
  if(state.mode==='orbit'){
    statusBar.textContent = 'Orbit mode — drag to rotate, scroll to zoom. Switch to Edit to paint.';
  } else {
    statusBar.textContent = `Edit mode — ${state.tool==='paint'?'Paint':'Fill'} tool, brush ${state.brushSize}×${state.brushSize}${state.mirror?', mirror ON':''}. Right-drag / two-finger drag to rotate.`;
  }
}
function flashStatus(msg, isErr){
  const old = statusBar.textContent;
  statusBar.textContent = msg;
  statusBar.style.color = isErr ? 'var(--danger)' : 'var(--good)';
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(()=>{ statusBar.style.color=''; updateStatus(); }, 1600);
}

// allow rotate via right mouse button / two-finger touch even in edit mode
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
host2.addEventListener('contextmenu', (e)=>e.preventDefault());
// In edit mode we still want right-click drag to orbit; enable rotate always,
// but ignore left-button drags for orbit while in edit mode via custom handling:
const origUpdate = controls.update.bind(controls);
host2.addEventListener('pointerdown', (e)=>{
  if(state.mode==='edit' && e.button===0){ controls.enableRotate = false; }
  else { controls.enableRotate = true; }
});
window.addEventListener('pointerup', ()=>{ controls.enableRotate = (state.mode==='orbit'); });

/* -------------------------------- Tool UI ---------------------------------*/
document.querySelectorAll('.toolbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.toolbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tool = btn.dataset.tool;
    updateStatus();
  });
});
const brushSlider = document.getElementById('brushSize');
const brushVal = document.getElementById('brushVal');
brushSlider.addEventListener('input', ()=>{
  state.brushSize = parseInt(brushSlider.value,10);
  brushVal.textContent = state.brushSize;
  updateStatus();
});
document.getElementById('mirrorToggle').addEventListener('change', (e)=>{
  state.mirror = e.target.checked;
  updateStatus();
});
document.querySelectorAll('.partVis').forEach(cb=>{
  cb.addEventListener('change', ()=>{
    const part = cb.dataset.part;
    state.partVisible[part] = cb.checked;
    if(partMeshes[part]) partMeshes[part].visible = cb.checked;
  });
});

/* ------------------------------ Import / Export ---------------------------*/
document.getElementById('btnImport').addEventListener('click', ()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      loadAvatarFromObject(obj);
      flashStatus('Imported ' + file.name);
    }catch(err){
      flashStatus('Import failed: '+err.message, true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btnExport').addEventListener('click', ()=>{
  const obj = buildAvatarObject();
  obj.createdAt = Date.now();
  const rand4 = Math.floor(1000 + Math.random()*9000);
  const filename = '1789535' + rand4 + '.json';
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  flashStatus('Exported ' + filename);
});

/* -------------------------------- Presets ---------------------------------*/
document.getElementById('presetDefault').addEventListener('click', ()=>{ loadAvatarFromObject(PRESET_DEFAULT); flashStatus('Loaded default preset'); });
document.getElementById('presetBiggest').addEventListener('click', ()=>{ loadAvatarFromObject(PRESET_BIGGEST); flashStatus('Loaded biggest preset'); });
document.getElementById('presetSmallest').addEventListener('click', ()=>{ loadAvatarFromObject(PRESET_SMALLEST); flashStatus('Loaded smallest preset'); });

/* --------------------------------- Theme -----------------------------------*/
const themeBtn = document.getElementById('btnTheme');
function setTheme(light){
  document.documentElement.classList.toggle('light', light);
  themeBtn.textContent = light ? '☀️' : '🌙';
}
setTheme(false);
themeBtn.addEventListener('click', ()=>{
  setTheme(!document.documentElement.classList.contains('light'));
});

/* ------------------------------ Panels (mobile) -----------------------------*/
const leftPanel = document.getElementById('leftPanel');
const rightPanel = document.getElementById('rightPanel');
const scrim = document.getElementById('scrim');
function closePanels(){ leftPanel.classList.remove('open'); rightPanel.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('panelToggleLeft').addEventListener('click', ()=>{
  const willOpen = !leftPanel.classList.contains('open');
  closePanels();
  if(willOpen){ leftPanel.classList.add('open'); scrim.classList.add('show'); }
});
document.getElementById('panelToggleRight').addEventListener('click', ()=>{
  const willOpen = !rightPanel.classList.contains('open');
  closePanels();
  if(willOpen){ rightPanel.classList.add('open'); scrim.classList.add('show'); }
});
scrim.addEventListener('click', closePanels);

/* --------------------------------- Boot ------------------------------------*/
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
function boot(){
  resizeRenderer();
  loadAvatarFromObject(PRESET_DEFAULT);
  setMode('orbit');
  animate();
}
boot();
</script>
